<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Flow All-Time Roster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:ital,wght@0,700;0,800;0,900;1,900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F6F5F0;
    --surface:#FFFFFF;
    --surface-2:#ECEEF1;
    --text:#16283D;
    --text-muted:#55647A;
    --border:#D8DCE3;
    --accent:#1B3A5A;
    --accent-soft:#E3E9F0;
    --accent2:#B8923F;
    --accent2-soft:#F5EBD6;
    --shadow: 0 1px 2px rgba(20,35,50,0.07), 0 6px 20px rgba(20,35,50,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1826;
      --surface:#142234;
      --surface-2:#1B2C42;
      --text:#EAEEF3;
      --text-muted:#93A2B8;
      --border:#26374C;
      --accent:#6E9CC7;
      --accent-soft:#1E3350;
      --accent2:#D8B168;
      --accent2-soft:#3A2E14;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1826;
    --surface:#142234;
    --surface-2:#1B2C42;
    --text:#EAEEF3;
    --text-muted:#93A2B8;
    --border:#26374C;
    --accent:#6E9CC7;
    --accent-soft:#1E3350;
    --accent2:#D8B168;
    --accent2-soft:#3A2E14;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{
    max-width:980px;
    margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:1.75rem;
    border-bottom:1px solid var(--border);
    margin-bottom:1.25rem;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:"Archivo Expanded", sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-size:1.1rem;
    padding:0.7rem 0.1rem 0.8rem;
    margin-bottom:-1px;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #surfaceFilter{margin-bottom:1.75rem;}

  /* ---------- leaders ---------- */
  .leaders{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:2rem;
  }
  .leader-card{
    background:var(--surface);
    padding:1rem 1.15rem 1.1rem;
  }
  .leader-card h3{
    font-family:"JetBrains Mono", monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--text-muted);
    margin:0 0 0.7rem;
    font-weight:600;
  }
  .leader-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:0.45rem;
  }
  .leader-item{
    display:flex;
    align-items:baseline;
    gap:0.5rem;
  }
  .leader-rank{
    font-family:"JetBrains Mono", monospace;
    font-size:0.76rem;
    color:var(--accent2);
    font-weight:700;
    width:1rem;
    flex:0 0 auto;
  }
  .leader-name{
    flex:1 1 auto;
    font-weight:600;
    font-size:0.88rem;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .leader-val{
    flex:0 0 auto;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    color:var(--accent);
    font-family:"JetBrains Mono", monospace;
    font-size:0.86rem;
  }
  @media (max-width: 640px){
    .leaders{grid-template-columns:1fr;}
  }

  /* ---------- passing network ---------- */
  .network-section{margin-bottom:2rem;}
  .network-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:0.6rem;
    flex-wrap:wrap;
    margin-bottom:0.75rem;
  }
  .network-title{
    font-family:"Archivo Expanded", sans-serif; font-weight:800;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.01em;
    font-size:1.35rem;
    margin:0;
  }
  .network-wrap{
    display:flex;
    gap:1.5rem;
    align-items:stretch;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:1.25rem;
    flex-wrap:wrap;
  }
  .network-chart{
    flex:1 1 340px;
    min-width:260px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .network-chart svg{width:100%; height:auto; display:block; max-width:620px;}
  .net-edge{fill:none; stroke:var(--accent); transition:opacity 0.15s ease, stroke 0.15s ease;}
  .net-edge.hi{stroke:var(--accent2);}
  .net-node{cursor:pointer;}
  .net-node circle{fill:var(--surface); stroke:var(--accent); stroke-width:1.6; transition:fill 0.15s ease, stroke 0.15s ease, opacity 0.15s ease;}
  .net-node text{font-family:"JetBrains Mono", monospace; font-size:9px; fill:var(--text-muted); pointer-events:none; transition:fill 0.15s ease, opacity 0.15s ease;}
  .net-node.dim{opacity:0.28;}
  .net-node.active circle, .net-node.hi circle{fill:var(--accent2); stroke:var(--accent2);}
  .net-node.active text, .net-node.hi text{fill:var(--text); font-weight:700;}
  .net-node:hover circle{stroke:var(--accent2);}
  .network-panel{
    flex:0 0 210px;
    min-width:190px;
  }
  .network-panel h4{
    font-family:"JetBrains Mono", monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
    margin:0 0 0.5rem;
  }
  .np-name{
    font-family:"Archivo Expanded", sans-serif; font-weight:800;
    font-weight:800;
    text-transform:uppercase;
    font-size:1.3rem;
    margin:0 0 0.15rem;
    line-height:1.05;
  }
  .np-sub{
    font-size:0.76rem;
    color:var(--text-muted);
    font-family:"JetBrains Mono", monospace;
    margin:0 0 0.85rem;
  }
  .np-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:0.4rem;
  }
  .np-list li{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:0.5rem;
    font-size:0.83rem;
  }
  .np-partner{
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .np-count{
    font-family:"JetBrains Mono", monospace;
    color:var(--accent);
    font-weight:700;
    flex:0 0 auto;
  }
  .network-empty{
    color:var(--text-muted);
    font-size:0.84rem;
  }
  .network-empty strong{color:var(--text);}

  /* ---------- head-to-head ---------- */
  .h2h-section{margin-bottom:2rem;}
  .h2h-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:0.6rem;
    flex-wrap:wrap;
    margin-bottom:0.75rem;
  }
  .h2h-title{
    font-family:"Archivo Expanded", sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.01em;
    font-size:1.35rem;
    margin:0;
  }
  .h2h-record{
    font-family:"JetBrains Mono", monospace;
    font-size:0.82rem;
    color:var(--text-muted);
  }
  .h2h-record strong{color:var(--accent); font-weight:700;}
  .h2h-search{
    display:block;
    position:relative;
    max-width:280px;
    margin-bottom:1.25rem;
  }
  .h2h-search input{
    width:100%;
    height:2.5rem;
    box-sizing:border-box;
    padding:0 0.85rem 0 2.2rem;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:0.88rem;
  }
  .h2h-search input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .h2h-search svg{
    position:absolute;
    left:0.7rem;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--text-muted);
  }
  .col-diff{font-variant-numeric:tabular-nums;}
  .col-diff.pos{color:var(--accent);}
  .col-diff.neg{color:var(--text-muted);}
  #h2hTable td.h2h-best{font-weight:700; color:var(--text);}
  .h2h-count{
    margin-top:0.6rem;
    color:var(--text-muted);
    font-size:0.78rem;
    font-family:"JetBrains Mono", monospace;
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    gap:0.75rem;
    align-items:center;
    margin-bottom:1rem;
    flex-wrap:wrap;
  }
  .search{
    position:relative;
    flex:1 1 200px;
  }
  .search input{
    width:100%;
    height:2.5rem;
    box-sizing:border-box;
    padding:0 0.85rem 0 2.2rem;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:0.92rem;
  }
  .search input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .search svg{
    position:absolute;
    left:0.7rem;
    top:50%;
    transform:translateY(-50%);
    width:15px;
    height:15px;
    color:var(--text-muted);
  }

  .tournament-select{
    position:relative;
    flex:0 0 auto;
  }
  .tournament-select select{
    appearance:none;
    height:2.5rem;
    box-sizing:border-box;
    padding:0 2.1rem 0 0.9rem;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:"Archivo", sans-serif;
    font-size:0.86rem;
    font-weight:600;
    cursor:pointer;
    max-width:220px;
  }
  .tournament-select select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .tournament-select::after{
    content:"";
    position:absolute;
    right:0.85rem;
    top:50%;
    width:0.5rem;
    height:0.5rem;
    border-right:1.5px solid var(--text-muted);
    border-bottom:1.5px solid var(--text-muted);
    transform:translateY(-70%) rotate(45deg);
    pointer-events:none;
  }

  /* ---------- table ---------- */
  .table-shell{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:auto;
    background:var(--surface);
    box-shadow:var(--shadow);
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:640px;
    font-variant-numeric:tabular-nums;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--surface-2);
    z-index:1;
    text-align:right;
    font-family:"Archivo Expanded", sans-serif; font-weight:800;
    font-size:0.82rem;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--text-muted);
    padding:0.65rem 0.9rem;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{color:var(--text);}
  thead th:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  thead th.col-rank, thead th.col-player{text-align:left;}
  thead th .arrow{
    display:inline-block;
    margin-left:0.25rem;
    opacity:0;
    color:var(--accent);
  }
  thead th.sorted .arrow{opacity:1;}

  tbody td{
    padding:0.55rem 0.9rem;
    border-bottom:1px solid var(--border);
    text-align:right;
    font-size:0.9rem;
    white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  td.col-rank{
    text-align:left;
    font-family:"JetBrains Mono", monospace;
    color:var(--text-muted);
    font-size:0.8rem;
    width:2.6rem;
  }
  td.col-player{
    text-align:left;
    font-weight:600;
    color:var(--text);
  }
  td.col-player .meta{
    display:flex;
    align-items:center;
    gap:0.4rem;
    margin-top:0.2rem;
  }
  td.col-player .seasons{
    font-weight:500;
    font-size:0.76rem;
    color:var(--text-muted);
    font-family:"Archivo", sans-serif;
    white-space:nowrap;
  }
  .chev{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:13px;
    height:13px;
    margin-right:0.4rem;
    color:var(--text-muted);
    transition:transform 0.15s ease;
    vertical-align:middle;
    flex:0 0 auto;
  }
  .jersey-badge{
    display:inline-block;
    font-family:"JetBrains Mono", monospace;
    font-size:0.7rem;
    font-weight:600;
    color:var(--text-muted);
    border:1px solid var(--border);
    border-radius:4px;
    padding:0.05rem 0.32rem;
    margin-left:0.5rem;
    vertical-align:middle;
    white-space:nowrap;
  }
  tr.expanded .jersey-badge{color:var(--accent); border-color:var(--accent);}
  .chev svg{width:100%; height:100%;}
  tbody tr[data-player]{cursor:pointer;}
  tr.expanded td.col-player{color:var(--accent);}
  tr.expanded .chev{transform:rotate(90deg); color:var(--accent);}
  tr.expanded td{background:var(--accent-soft);}

  /* ---------- expanded player detail ---------- */
  tr.expand-row td{
    background:var(--surface-2);
    padding:0.45rem 0.9rem 0.55rem;
    cursor:default;
    white-space:normal;
    border-bottom:1px solid var(--border);
  }
  .expand-sub{
    font-size:0.78rem;
    color:var(--text-muted);
    font-family:"Archivo", sans-serif;
    font-weight:500;
    margin:0 0 0.3rem;
  }
  .expand-chart-wrap{
    overflow-x:auto;
    margin-bottom:0.35rem;
  }
  .expand-chart-wrap svg{display:block;}
  .expand-chart-wrap .bar-val{font-family:"JetBrains Mono", monospace;}
  .expand-section-title{
    font-family:"JetBrains Mono", monospace;
    font-size:0.66rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-muted);
    margin:0 0 0.2rem;
  }
  .expand-table{
    width:100%;
    border-collapse:collapse;
    font-variant-numeric:tabular-nums;
  }
  .expand-table th{
    text-align:right;
    font-family:"Archivo Expanded", sans-serif;
    font-weight:800;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.01em;
    color:var(--text-muted);
    padding:0.12rem 0.45rem;
    border-bottom:1px solid var(--border);
  }
  .expand-table th:first-child{text-align:left;}
  .expand-table td{
    text-align:right;
    padding:0.13rem 0.45rem;
    border-bottom:1px solid var(--border);
    font-size:0.82rem;
  }
  .expand-table td:first-child{text-align:left; font-weight:600;}
  .expand-table tr:last-child td{border-bottom:none;}
  .expand-table tr.all-row td{color:var(--accent); font-weight:700;}
  .expand-table tr.active-row td{background:var(--accent-soft);}
  td.col-total{
    font-family:"Archivo Expanded", sans-serif; font-weight:800;
    font-size:0.98rem;
    color:var(--accent);
  }
  .bar-cell{
    position:relative;
  }
  .bar-track{
    position:absolute;
    left:0.9rem; right:0.9rem; bottom:0.32rem;
    height:3px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:2px;
  }
  tr.top3 td.col-rank{color:var(--accent2); font-weight:700;}
  tr.top3 td.col-player{color:var(--accent2);}

  .empty-row td{
    text-align:center;
    color:var(--text-muted);
    padding:2rem;
    font-style:italic;
  }

  footer{
    margin-top:2rem;
    display:flex;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
    color:var(--text-muted);
    font-size:0.78rem;
    font-family:"JetBrains Mono", monospace;
  }
  footer a{color:var(--accent); text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  /* ---------- surface filter ---------- */
  .surface-filter{
    display:inline-flex;
    gap:2px;
    padding:3px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:9px;
    flex:0 0 auto;
  }
  .surface-filter button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:"Archivo", sans-serif;
    font-size:0.84rem;
    font-weight:600;
    padding:0.4rem 0.8rem;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:0.4rem;
    white-space:nowrap;
  }
  .surface-filter button .surf-icon{
    width:14px; height:14px;
    flex:0 0 auto;
    opacity:0.6;
  }
  #surfaceFilter{display:flex; width:100%;}
  #surfaceFilter button{flex:1; justify-content:center;}
  #metricToggle{height:2.5rem; box-sizing:border-box;}
  #metricToggle button{padding-top:0; padding-bottom:0;}
  .surface-filter button:hover{color:var(--text);}
  .surface-filter button.active{
    background:var(--surface);
    color:var(--accent);
    box-shadow:var(--shadow);
  }
  .surface-filter button.active .surf-icon{opacity:1;}
  .surface-filter button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
</style>

<div class="wrap">

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab-btn active" data-tab="players" role="tab" aria-selected="true">Players</button>
    <button type="button" class="tab-btn" data-tab="team" role="tab" aria-selected="false">Team</button>
  </nav>

  <div class="surface-filter" id="surfaceFilter" role="tablist" aria-label="Filter by surface">
    <button type="button" class="active" data-surface="all" role="tab" aria-selected="true"><svg class="surf-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>All surfaces</button>
    <button type="button" data-surface="outdoor" role="tab" aria-selected="false"><svg class="surf-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.4M8 13.6V15M15 8h-1.4M2.4 8H1M12.9 3.1l-1 1M4.1 11.9l-1 1M12.9 12.9l-1-1M4.1 4.1l-1-1"/></svg>Outdoor</button>
    <button type="button" data-surface="beach" role="tab" aria-selected="false"><svg class="surf-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="1.5" r="0.5" fill="currentColor" stroke="none"/><path d="M1.5 7.5C1.5 4 4.4 1.5 8 1.5S14.5 4 14.5 7.5"/><path d="M8 2v11"/><path d="M1 14.6q3.5-1.6 7 0t7 0"/></svg>Beach</button>
    <button type="button" data-surface="indoor" role="tab" aria-selected="false"><svg class="surf-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5 8 3l6 5.5"/><path d="M3.5 7.5V14h9V7.5"/></svg>Indoor</button>
  </div>

  <div class="tab-panel" id="panelPlayers">

    <section class="leaders" id="leadersSection"></section>

    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchBox" placeholder="Find a player&hellip;" autocomplete="off">

function buildPlayerChart(name, scopeKey){
  const scoped = (YEARLY_BY_SCOPE[name] && YEARLY_BY_SCOPE[name][scopeKey]) || {};
  const years = Object.keys(scoped).map(Number).sort((a,b) => a - b);
  if (years.length === 0) return '';
  const vals = years.map(y => scoped[y]);
  const barW = 24, gap = 5, padL = 24, padB = 14, padT = 10;
  const chartH = 64;
  const w = padL + years.length*(barW+gap);
  const h = padT + chartH + padB;
  const max = Math.max(...vals, 1);
  let bars = '';
  years.forEach((y,i) => {
    const v = vals[i];
    const bh = v>0 ? Math.max(3, (v/max)*chartH) : 1;
    const x = padL + i*(barW+gap);
    const y0 = padT + (chartH - bh);
    bars += `<rect x="${x}" y="${y0}" width="${barW}" height="${bh}" rx="3" fill="${v>0?'var(--accent)':'var(--border)'}"><title>${y}: ${v} pts</title></rect>`;
    bars += `<text class="bar-val" x="${x+barW/2}" y="${y0-4}" font-size="9" text-anchor="middle" fill="var(--text-muted)">${v>0?v:''}</text>`;
    bars += `<text x="${x+barW/2}" y="${padT+chartH+14}" font-size="9" text-anchor="middle" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">${y}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <line x1="${padL}" y1="${padT+chartH}" x2="${w}" y2="${padT+chartH}" stroke="var(--border)" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

function buildPlayerTable(d, activeScopeKey){
  const rows = [['All tournaments (career)', d.all, true, 'all']];
  ['ppm','mpm','wlu','plu','beachcup','hmp','poligon'].forEach(key => {
    if (d.series[key].seasons > 0) rows.push([SERIES_META[key].label, d.series[key], false, key]);
  });
  const head = `<tr><th>Tournament</th><th>Seasons</th><th>Games</th><th>Assists</th><th>Goals</th><th>Total</th></tr>`;
  const body = rows.map(([label, b, isAll, key]) => {
    const isActive = !!activeScopeKey && (key === activeScopeKey || (SERIES_META[key] && SERIES_META[key].surface === activeScopeKey));
    const cls = [isAll ? 'all-row' : '', isActive ? 'active-row' : ''].filter(Boolean).join(' ');
    return `<tr class="${cls}"><td>${label}</td><td>${b.seasons}</td><td>${b.games}</td><td>${b.assists}</td><td>${b.points}</td><td>${b.sum}</td></tr>`;
  }).join('');
  return `<table class="expand-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function buildExpandContent(name){
  const d = DATA.find(x => x.name === name);
  if (!d) return '';
  const scopeKey = currentScopeKey();
  const bucket = currentBucket(d);
  const label = scopeDisplayName();
  const sub = bucket.seasons > 0
    ? `${label}: ${bucket.minY}–${bucket.maxY} · ${bucket.seasons} season${bucket.seasons===1?'':'s'} · ${bucket.games} games · ${bucket.sum} points`
    : `${label}: no recorded appearances`;
  const chart = buildPlayerChart(d.name, scopeKey);
  return `
    <p class="expand-sub">${sub}</p>
    ${chart ? `<div class="expand-chart-wrap">${chart}</div>` : ''}
    <p class="expand-section-title">Career, by tournament</p>
    <div style="overflow-x:auto;">${buildPlayerTable(d, scopeKey)}</div>
  `;
}

const NET_NODES = ["Bartłomiej Specjał","Paweł Milanowicz","Daniel Błach","Sergii Anufriiev","Tomasz Zatoń","Małgorzata Czaplińska","Dariusz Urbanik","Maciej Pająk","Jakub Wróbel","Michał Krotliński","Aleksandra Szyrwiel","Rafał Furman","Maja Kozak","Marcin Bielewski","Anton Gatsko","Natalia Nędzi","Andrzej Zaród","Anna Jeziorska","Zuzanna Brzezińska","Mateusz Skorupa","Maciej Zięba","Katarzyna Widźgowska","Katarzyna Dobranowska","Michał Dul"];

function netInitials(name){
  const parts = name.split(' ');
  return parts[0] + ' ' + parts[parts.length-1][0] + '.';
}

// node positions are fixed (based on all-time involvement) so the layout doesn't reshuffle when the surface/tournament filter changes
let NET_ORDER = null, NET_POS = null;
function initNetworkLayout(){
  const degree = {};
  NET_NODES.forEach(n => degree[n] = 0);
  NET_EDGES_BY_SCOPE.all.forEach(([a,b,w]) => { degree[a] = (degree[a]||0) + w; degree[b] = (degree[b]||0) + w; });

  NET_ORDER = NET_NODES.slice().sort((a,b) => degree[b] - degree[a]);
  NET_POS = {};
  const N = NET_ORDER.length;
  const cx = 310, cy = 225, R = 158;
  NET_ORDER.forEach((name, i) => {
    const angle = -Math.PI/2 + (i / N) * Math.PI * 2;
    NET_POS[name] = { x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle), angle };
  });
}

function buildNetwork(){
  const order = NET_ORDER, pos = NET_POS;
  const cx = 310, cy = 225;
  const edges = NET_EDGES_BY_SCOPE[currentScopeKey()] || [];

  document.getElementById('networkScope').textContent = scopeDisplayName();

  const degree = {};
  NET_NODES.forEach(n => degree[n] = 0);
  edges.forEach(([a,b,w]) => { degree[a] = (degree[a]||0) + w; degree[b] = (degree[b]||0) + w; });

  // combine reciprocal directed edges into one undirected weight for the visual
  const combined = {};
  const dir = {};
  edges.forEach(([a,b,w]) => {
    dir[a + '->' + b] = w;
    const key = a < b ? a + '||' + b : b + '||' + a;
    combined[key] = (combined[key] || 0) + w;
  });
  const combinedEntries = Object.entries(combined);
  const maxCombined = Math.max(1, ...combinedEntries.map(e => e[1]));

  let edgeSvg = '';
  combinedEntries.forEach(([key, w]) => {
    const [a, b] = key.split('||');
    const pa = pos[a], pb = pos[b];
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    const bow = 0.32;
    const qx = cx + (mx - cx) * (1 - bow), qy = cy + (my - cy) * (1 - bow);
    const strokeW = (0.5 + Math.sqrt(w) * 0.75).toFixed(2);
    const op = (0.1 + (w / maxCombined) * 0.55).toFixed(3);
    edgeSvg += `<path class="net-edge" data-a="${a}" data-b="${b}" d="M${pa.x.toFixed(1)},${pa.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${pb.x.toFixed(1)},${pb.y.toFixed(1)}" stroke-width="${strokeW}" opacity="${op}"></path>`;
  });

  const maxDeg = Math.max(1, ...Object.values(degree));
  let nodeSvg = '';
  order.forEach(name => {
    const p = pos[name];
    const r = 3 + Math.sqrt(degree[name] / maxDeg) * 7;
    const onRight = Math.cos(p.angle) >= -0.02;
    const labelX = p.x + (onRight ? r + 4 : -(r + 4));
    nodeSvg += `<g class="net-node" data-name="${name.replace(/"/g,'&quot;')}">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"></circle>
      <text x="${labelX.toFixed(1)}" y="${(p.y+3).toFixed(1)}" text-anchor="${onRight?'start':'end'}">${netInitials(name)}</text>
    </g>`;
  });

  const svg = `<svg viewBox="0 0 620 450" width="620" height="450">
    <g id="netEdges">${edgeSvg}</g>
    <g id="netNodes">${nodeSvg}</g>
  </svg>`;
  document.getElementById('networkChart').innerHTML = svg;

  const topPair = combinedEntries.slice().sort((a,b)=>b[1]-a[1])[0];
  renderNetworkPanel(null, {dir, degree, topPair});

  document.querySelectorAll('.net-node').forEach(g => {
    g.addEventListener('click', () => {
      const name = g.dataset.name;
      const alreadyActive = g.classList.contains('active');
      selectNetworkNode(alreadyActive ? null : name, {dir, degree, topPair});
    });
  });
}

function selectNetworkNode(name, ctx){
  document.querySelectorAll('.net-node').forEach(g => {
    const isActive = g.dataset.name === name;
    g.classList.toggle('active', isActive);
    g.classList.toggle('dim', !!name && !isActive);
  });
  document.querySelectorAll('.net-edge').forEach(p => {
    if (!name) { p.classList.remove('hi'); p.style.opacity = ''; return; }
    const touches = p.dataset.a === name || p.dataset.b === name;
    p.classList.toggle('hi', touches);
    p.style.opacity = touches ? 0.9 : 0.04;
  });
  renderNetworkPanel(name, ctx);
}

function renderNetworkPanel(name, ctx){
  const panel = document.getElementById('networkPanel');
  if (!name) {
    if (!ctx.topPair) {
      panel.innerHTML = `
      <h4>Overview</h4>
      <p class="network-empty">No plays recorded for <strong>${scopeDisplayName()}</strong>.</p>`;
      return;
    }
    const [pairKey, w] = ctx.topPair;
    const [a,b] = pairKey.split('||');
    panel.innerHTML = `
      <h4>Overview</h4>
      <p class="network-empty">Strongest connection: <strong>${netInitials(a)}</strong> &harr; <strong>${netInitials(b)}</strong> (${w} logged plays). Click any player to see their top partners.</p>`;
    return;
  }
  const partners = {};
  Object.entries(ctx.dir).forEach(([key, w]) => {
    const [a,b] = key.split('->');
    if (a === name) { partners[b] = partners[b] || {to:0, from:0}; partners[b].to += w; }
    if (b === name) { partners[a] = partners[a] || {to:0, from:0}; partners[a].from += w; }
  });
  const list = Object.entries(partners)
    .map(([p, v]) => ({partner:p, total: v.to+v.from, to:v.to, from:v.from}))
    .sort((a,b) => b.total - a.total)
    .slice(0,7);
  panel.innerHTML = `
    <h4>Selected player</h4>
    <p class="np-name">${name}</p>
    <p class="np-sub">${ctx.degree[name]} total connections</p>
    <ol class="np-list">
      ${list.map(p => `<li title="${name} → ${p.partner}: ${p.to} · ${p.partner} → ${name}: ${p.from}"><span class="np-partner">${p.partner}</span><span class="np-count">${p.total}</span></li>`).join('')}
    </ol>`;
}

let sortKey = 'sum', sortDir = -1;
let surface = 'all';
let tournament = 'all';
let metricMode = 'total';
let expandedPlayer = null;

const METRIC_HEAD = {
  total:     {assists:'Assists', points:'Goals', sum:'Total'},
  perGame:   {assists:'Ast/G',   points:'Gl/G',  sum:'Tot/G'},
  perSeason: {assists:'Ast/Szn', points:'Gl/Szn', sum:'Tot/Szn'}
};

function metricVal(d, field){
  if (metricMode === 'total') return d[field];
  if (metricMode === 'perGame') return d.games ? d[field]/d.games : 0;
  return d.seasons ? d[field]/d.seasons : 0;
}
function fmtMetric(v){
  return metricMode === 'total' ? String(v) : v.toFixed(2);
}
function updateMetricHeaders(){
  const map = METRIC_HEAD[metricMode];
  ['assists','points','sum'].forEach(key => {
    const th = document.querySelector(`thead th[data-key="${key}"]`);
    if (th && th.firstChild) th.firstChild.textContent = map[key];
  });
}

function currentBucket(d){
  if (tournament !== 'all') return d.series[tournament];
  return d[surface];
}
function currentScopeKey(){
  return tournament !== 'all' ? tournament : surface;
}
function scopeDisplayName(){
  if (tournament !== 'all') return SERIES_META[tournament].label;
  if (surface === 'all') return 'All tournaments';
  return surface.charAt(0).toUpperCase() + surface.slice(1);
}

function renderTable(filterText){
  const body = document.getElementById('rosterBody');
  const f = (filterText||'').trim().toLowerCase();
  let rows = DATA
    .filter(d => d.name.toLowerCase().includes(f))
    .filter(d => currentBucket(d).seasons > 0)
    .map(d => ({name:d.name, ...currentBucket(d)}));

  const maxMetricSum = Math.max(1, ...rows.map(d=>metricVal(d,'sum')));

  rows = rows.slice().sort((a,b) => {
    if(sortKey === 'name') return sortDir * a.name.localeCompare(b.name);
    if(sortKey === 'assists' || sortKey === 'points' || sortKey === 'sum') return sortDir * (metricVal(a,sortKey) - metricVal(b,sortKey));
    return sortDir * (a[sortKey] - b[sortKey]);
  });

  const scopeLabel = tournament !== 'all' ? SERIES_META[tournament].label : (surface === 'all' ? 'any surface' : surface);
  if(rows.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="7">No player matches “${filterText}” in ${scopeLabel}.</td></tr>`;
    document.getElementById('rowCount').textContent = '0 players shown';
    return;
  }

  body.innerHTML = rows.map((d, i) => {
    const rank = i + 1;
    const metricSum = metricVal(d,'sum');
    const pct = Math.max(4, Math.round((metricSum / maxMetricSum) * 100));
    const isExpanded = d.name === expandedPlayer;
    const safeName = d.name.replace(/"/g,'&quot;');
    const summaryRow = `<tr class="${sortKey==='sum' && sortDir===-1 && rank<=3 ? 'top3' : ''}${isExpanded ? ' expanded' : ''}" data-player="${safeName}">
      <td class="col-rank">${rank}</td>
      <td class="col-player"><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span>${d.name}${JERSEY[d.name] ? `<span class="jersey-badge">#${JERSEY[d.name]}</span>` : ''}<span class="meta"><span class="seasons">${d.minY===d.maxY ? d.minY : d.minY+'–'+d.maxY} &middot; ${d.seasons} season${d.seasons===1?'':'s'}</span></span></td>
      <td>${d.seasons}</td>
      <td>${d.games}</td>
      <td>${fmtMetric(metricVal(d,'assists'))}</td>
      <td>${fmtMetric(metricVal(d,'points'))}</td>
      <td class="col-total bar-cell">${fmtMetric(metricSum)}<span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span></td>
    </tr>`;
    const expandRow = isExpanded ? `<tr class="expand-row"><td colspan="7">${buildExpandContent(d.name)}</td></tr>` : '';
    return summaryRow + expandRow;
  }).join('');

  document.getElementById('rowCount').textContent = `${rows.length} of ${DATA.length} players shown`;
}

function updateSortIndicators(){
  document.querySelectorAll('#rosterTable thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    const arrow = th.querySelector('.arrow');
    if(arrow) arrow.innerHTML = sortDir === 1 ? '&uarr;' : '&darr;';
  });
}

function packH2H(a){ return {games:a[0], wins:a[1], losses:a[2], pf:a[3], pa:a[4]}; }
const H2H_ALL = H2H_RAW.map(r => ({
  name:r[0],
  all:packH2H(r[1]), outdoor:packH2H(r[2]), beach:packH2H(r[3]), indoor:packH2H(r[4]),
  series:{ ppm:packH2H(r[5]), mpm:packH2H(r[6]), hmp:packH2H(r[7]), beachcup:packH2H(r[8]), wlu:packH2H(r[9]), plu:packH2H(r[10]), poligon:packH2H(r[11]) }
}));
// drop one-off opponents (faced fewer than 2 times all-time) from the listed table so hat-tournament pickup teams don't clutter it
const H2H_DATA = H2H_ALL.filter(d => d.all.games >= 2);

function winPct(d){ return d.games ? (d.wins / d.games) * 100 : 0; }

let h2hSortKey = 'games', h2hSortDir = -1;

function renderH2H(filterText){
  const body = document.getElementById('h2hBody');
  const f = (filterText||'').trim().toLowerCase();
  let rows = H2H_DATA
    .filter(d => d.name.toLowerCase().includes(f))
    .filter(d => currentBucket(d).games > 0)
    .map(d => ({name:d.name, ...currentBucket(d)}));

  rows = rows.slice().sort((a,b) => {
    if(h2hSortKey === 'name') return h2hSortDir * a.name.localeCompare(b.name);
    if(h2hSortKey === 'winpct') return h2hSortDir * (winPct(a) - winPct(b));
    if(h2hSortKey === 'diff') return h2hSortDir * ((a.pf - a.pa) - (b.pf - b.pa));
    if(h2hSortKey === 'record') return h2hSortDir * (a.wins - b.wins);
    return h2hSortDir * (a[h2hSortKey] - b[h2hSortKey]);
  });

  const scopeLabel = tournament !== 'all' ? SERIES_META[tournament].label : (surface === 'all' ? 'any surface' : surface);

  const allInScope = H2H_ALL.map(d => currentBucket(d)).filter(b => b.games > 0);
  const totalGames = allInScope.reduce((s,b) => s + b.games, 0);
  const totalWins = allInScope.reduce((s,b) => s + b.wins, 0);
  const totalLosses = allInScope.reduce((s,b) => s + b.losses, 0);
  document.getElementById('h2hRecord').innerHTML = totalGames
    ? `<strong>${totalWins}-${totalLosses}</strong> (${Math.round((totalWins/totalGames)*100)}%) in ${scopeLabel}`
    : `No games recorded in ${scopeLabel}`;

  if(rows.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No opponent matches “${filterText}” in ${scopeLabel}.</td></tr>`;
    document.getElementById('h2hCount').textContent = '0 opponents shown';
    return;
  }

  const maxGames = Math.max(...rows.map(d => d.games));
  const maxWinDiff = Math.max(...rows.map(d => d.wins - d.losses));
  const maxWinPct = Math.max(...rows.map(d => winPct(d)));
  const maxPtDiff = Math.max(...rows.map(d => d.pf - d.pa));

  body.innerHTML = rows.map((d, i) => {
    const rank = i + 1;
    const diff = d.pf - d.pa;
    const diffStr = (diff > 0 ? '+' : '') + diff;
    const wp = winPct(d);
    const winDiff = d.wins - d.losses;
    return `<tr>
      <td class="col-rank">${rank}</td>
      <td class="col-player">${d.name}</td>
      <td class="${d.games === maxGames ? 'h2h-best' : ''}">${d.games}</td>
      <td class="${winDiff === maxWinDiff ? 'h2h-best' : ''}">${d.wins}-${d.losses}</td>
      <td class="${wp === maxWinPct ? 'h2h-best' : ''}">${wp.toFixed(0)}%</td>
      <td class="col-diff ${diff > 0 ? 'pos' : (diff < 0 ? 'neg' : '')} ${diff === maxPtDiff ? 'h2h-best' : ''}">${diffStr}</td>
    </tr>`;
  }).join('');

  document.getElementById('h2hCount').textContent = `${rows.length} of ${H2H_DATA.length} opponents shown`;
}

function updateH2HSortIndicators(){
  document.querySelectorAll('#h2hTable thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === h2hSortKey);
    const arrow = th.querySelector('.arrow');
    if(arrow) arrow.innerHTML = h2hSortDir === 1 ? '&uarr;' : '&darr;';
  });
}

function renderLeaders(){
  const active = DATA.filter(d => currentBucket(d).seasons > 0).map(d => ({name:d.name, ...currentBucket(d)}));
  const byGames = active.slice().sort((a,b) => b.games - a.games).slice(0,3);
  const byAssists = active.slice().sort((a,b) => metricVal(b,'assists') - metricVal(a,'assists')).slice(0,3);
  const byGoals = active.slice().sort((a,b) => metricVal(b,'points') - metricVal(a,'points')).slice(0,3);
  const modeSuffix = metricMode === 'perGame' ? ' &middot; per game' : (metricMode === 'perSeason' ? ' &middot; per season' : '');

  const card = (title, list, valueFn) => `
    <div class="leader-card">
      <h3>${title}</h3>
      <ol class="leader-list">
        ${list.map((d,i) => `<li class="leader-item"><span class="leader-rank">${i+1}</span><span class="leader-name">${d.name}</span><span class="leader-val">${valueFn(d)}</span></li>`).join('')}
      </ol>
    </div>`;

  document.getElementById('leadersSection').innerHTML =
    card('Most games played', byGames, d => d.games) +
    card('Most assists' + modeSuffix, byAssists, d => fmtMetric(metricVal(d,'assists'))) +
    card('Most goals' + modeSuffix, byGoals, d => fmtMetric(metricVal(d,'points')));
}

function rerender(){
  renderLeaders();
  renderTable(document.getElementById('searchBox').value);
  renderH2H(document.getElementById('h2hSearchBox').value);
  buildNetwork();
}

document.querySelectorAll('#rosterTable thead th[data-key]').forEach(th => {
  const activate = () => {
    const key = th.dataset.key;
    if(key === 'rank') return;
    if(sortKey === key){ sortDir *= -1; } else { sortKey = key; sortDir = key === 'name' ? 1 : -1; }
    updateSortIndicators();
    renderTable(document.getElementById('searchBox').value);
  };
  th.addEventListener('click', activate);
  th.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }});
});

document.getElementById('searchBox').addEventListener('input', e => renderTable(e.target.value));

document.querySelectorAll('#h2hTable thead th[data-key]').forEach(th => {
  const activate = () => {
    const key = th.dataset.key;
    if(key === 'rank') return;
    if(h2hSortKey === key){ h2hSortDir *= -1; } else { h2hSortKey = key; h2hSortDir = key === 'name' ? 1 : -1; }
    updateH2HSortIndicators();
    renderH2H(document.getElementById('h2hSearchBox').value);
  };
  th.addEventListener('click', activate);
  th.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); activate(); }});
});

document.getElementById('h2hSearchBox').addEventListener('input', e => renderH2H(e.target.value));

document.querySelectorAll('#surfaceFilter button').forEach(btn => {
  btn.addEventListener('click', () => {
    surface = btn.dataset.surface;
    tournament = 'all';
    document.getElementById('tournamentFilter').value = 'all';
    document.querySelectorAll('#surfaceFilter button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    rerender();
  });
});

document.getElementById('tournamentFilter').addEventListener('change', (e) => {
  tournament = e.target.value;
  if (tournament !== 'all') {
    surface = SERIES_META[tournament].surface;
    document.querySelectorAll('#surfaceFilter button').forEach(b => {
      const match = b.dataset.surface === surface;
      b.classList.toggle('active', match);
      b.setAttribute('aria-selected', match ? 'true' : 'false');
    });
  }
  rerender();
});

document.querySelectorAll('#metricToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    metricMode = btn.dataset.metric;
    document.querySelectorAll('#metricToggle button').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    updateMetricHeaders();
    rerender();
  });
});

document.getElementById('rosterBody').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-player]');
  if (!row) return;
  const name = row.dataset.player;
  expandedPlayer = expandedPlayer === name ? null : name;
  renderTable(document.getElementById('searchBox').value);
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => {
      const match = b === btn;
      b.classList.toggle('active', match);
      b.setAttribute('aria-selected', match ? 'true' : 'false');
    });
    document.getElementById('panelPlayers').hidden = tab !== 'players';
    document.getElementById('panelTeam').hidden = tab !== 'team';
  });
});

renderLeaders();
initNetworkLayout();
buildNetwork();
updateSortIndicators();
updateH2HSortIndicators();
updateMetricHeaders();
renderTable('');
renderH2H('');
</script>

</body></html>
